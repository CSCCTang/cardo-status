# 章节契约 v1（cardo-status-report · T19）
#
# 是什么：模板每个节点（按出现顺序 t01–t23）在项目报告里“要写成什么样”的结构化判据。
# 不变量：
#   * 标题文字不进本文件——唯一真相是模板 docx（sha256 登记在 template.sha256）；
#     本文件只登记节点顺序/层级/写作单元/要求条目；模板一改由 CHK-CONTRACT-1 报漂移。
#   * 改契约 = 改标准：version+1 + 跑回归（见 docs/数据与标准基线.md §4）。
#   * check: auto 由 check_contracts.py 判；check: manual 只进“人工确认清单”，不判 fail。
#   * 方向键 = cardo-project-material/规则/项目库配置.yaml 的 directions（不写方向一/二/三）。
#   * template.file 只是可读线索（相对数据区写法）；实际模板路径由 --template /
#     项目内 05_过程/模板/ / skill 自带模板 注入，脚本不按本字段找文件。

schema: cardo/chapter-contract/v1
version: 2
template:
  file: "标准模板/1 城市更新项目现状分析报告（模板）-补充数据来源（包含三类项目）.docx"
  sha256: "758289c670056ee75987dbc2880a05d7fff9241a3b24742298f8bdac61497102"
  max_level: 2

extra_sections:
  # 模板外允许出现的 H1/H2 白名单（问题分类 8 个 + 附件 5 个）。
  # 未登记的新增 H1/H2 一律 fail（CHK-TPL-2）；新项目要加节，先改契约 + 升 version。
  # level 只登记"模板外标题允许出现的层级上限"；CHK-TPL-2 实际按标题文字校验 H1/H2。
  level: 3
  titles:
    - 街巷空间与肌理问题
    - 建筑安全与风貌破损问题
    - 文脉保护与活化不足问题
    - 业态老旧与活力不足问题
    - 交通通行与消防隐患突出问题
    - 基础设施老旧滞后问题
    - 民生配套与人居品质偏低
    - 街区治理与运营短板
    - 附件一 现有基础资料清单
    - 附件二 图件与影像资料
    - 附件三 专项台账
    - 附件四 数据缺口索引
    # v2：现状分析报告补三节——指标测算、成因分析、更新潜力（均落在本片区实测值上）
    - 现状指标体系与测算结果
    - 成因分析
    - 更新潜力与问题识别
    - 核心问题清单

assertions: [CHK-TPL-1, CHK-TPL-2, CHK-SRC-1, CHK-BAN-1, CHK-NUM-1, CHK-GAP-1, CHK-CLEAN-1, CHK-REQ-1, CHK-TBL, CHK-DOCX-1, CHK-CONTRACT-1, CHK-DIR-1]
banned_phrases_ref: "06-分章成文/规则/禁句表.yaml"
banned_direction_markers: [方向二, 方向三]
# CHK-NUM-1 白名单：确属政策/标准引用、原始材料里本来就没有的数值才登记（不得用来掩盖改数）。
num_whitelist: []

# 节点：id/level 由模板顺序生成；标题文字不在本文件。写作单元 A–E 与分章初稿/缺项字母共用。
nodes:
  - id: t01
    level: 1
    writing_unit: A
    sources_row: not_required
    requirements:
      common:
        - {id: t01-r1, type: section_exists, titles: [项目概况, 项目编制依据, 项目调研范围与期限], check: auto}
        - {id: t01-r2, type: keywords_any, keywords: [建设单位, 建设性质, 建设内容], check: auto}
    assertions: []
  - id: t02
