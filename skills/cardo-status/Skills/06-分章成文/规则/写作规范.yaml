# 写作规范 v2（cardo-status-spec · 结论优先改版）
# 唯一真相：所有章节 skill / 合成 skill / 编排 skill 都引用本文件，不复制。
# v2 变更（依据真实用户试用反馈）：
#   ① 结论优先——每节先给初步判定，资料再少也要有判定，不许整章写「资料缺失」；
#   ② 缺口降级——正文不出现缺口语，缺口只进 数据缺口清单.xlsx 与过程文件；
#   ③ 默认出干净版（clean），需要缺项留痕时用 --edition gap；
#   ④ 允许联网检索补充公开信息，须标来源与检索日期；
#   ⑤ 第四章每类问题必须给初步判定（五要素），不得整列「资料缺失」。
schema: cardo/writing-spec/v1
version: 2

# ── 版本与缺口口径 ────────────────────────────────────────────────────
edition:
  default: clean          # 干净交付版：正文不含缺口提示、不含附件四
  gap: gap                # 缺项留痕版（可选产物）：正文可带【缺项-XNN：…】，附录汇总
  clean_banned_in_body:   # 干净版正文禁用的口语（出现即判不合格）
    - 资料缺失
    - 未提供
    - 未获取
    - 资料不足
    - 缺项-
    - 待补
    - 缺什么
    - 找谁补
  gap_table_file: 数据缺口清单.xlsx   # 缺口唯一出口（另有附录/过程文件）
  note: 缺口不等于不能判断。先按现有材料给出初步判定，再把「哪些数据能把判断做得更准」写进缺口清单。

# 一、证据与来源行（硬规则）
source_line:
  format: "（数据来源：项目资料，来源：<来源>，第 N 页/段 N）"
  network_format: "（数据来源：网络资料，来源：<机构>，网址：<url>，获取日期：YYYY-MM-DD；编号 [S-0xx]）"
  inferred_format: "（数据来源：推断，依据：<现有材料/公开区间>，置信度：中/低；已查口径与日期见台账 [S-0xx]）"
  required_per_section: true   # 仅限「未按标注源成文」的旧口径；标注源成文按 evidence_block 走
  allowed_sources:
    - 项目资料
    - 可研
    - 源报告
    - 附表
    - 附图
    - 网络资料
    - 现场调查
    - 推断
  rule: 每节至少 1 条；每条判断/数据都必须能对应到来源；推断必须标推断并写依据。

# 一之二、依据块（标注源 = 唯一生产线 · 成稿口径）
# 每段（含每个表格）末尾另起一行；08 据此剥离出干净版并生成《依据对照表.xlsx》。
# 正文自己不写编号、不写「（数据来源：…）」、不写置信度——写进依据块。
evidence_block:
  format: "〔锚点 <章>-<节>-P<段序两位>｜材料：<文件名>，<表号/页码>｜推导：a+b=c｜定稿值：k=v｜公开：S-001｜置信度：高〕"
  anchor: "<章字母>-<节号>-P<段序两位>；表格用 <章>-<节>-表N"
  fields:
    材料: 文件名 + 表号/页码，多个用「；」分隔；文件名必须与转储清单里的真实文件对得上
    推导: 写成可复算的四则运算并写全结果（如 15350/19720=77.8%），不许只给结果
    定稿值: 键=值，键必须在 过程文件/00-总控/定稿值.json 里登记
    公开: 检索台账编号 S-001（台账条目无效等同没写）
    置信度: 高/中/低
  coverage: 每个自然段与每个表格都必须恰有一条依据块；缺一条即判「段落覆盖」不通过
  strip_rule: 干净版＝标注版剥离〔…〕与 [S-xxx]；剥离前后数值集合与顺序必须完全一致，不一致即 fail。
  legacy: 旧式「（数据来源：…）」行不再作为成稿写法（仍兼容，由 08 剥离、不进干净版）。

# 二、结论优先（每节第一段必须是判定，不是背景）
conclusion_first:
  required: true
  order:
    - 初步判定（一句话说清好/差/什么水平）
    - 支撑（1～3 条证据，或推断依据）
    - 归因
    - 与第四章问题 / 第五章对策的衔接
  # 固定句式（照此写，便于自检识别「本节有判定」）：
  template: "初步判定：<结论>（推断依据：<材料/公开区间>；置信度：高/中/低；区间：<a～b>）"
  min_judgements_per_section: 1

# 二之二、正文表达（正文不是表格，也不是清单）
body_style:
  roster_rule: 成段罗列三个以上对象的参数（栋数/户数/面积/工程量）即判不合格；多对象参数一律进表，正文只留判断与总量。
  roster_detect: 同一自然段内出现 ≥3 组「数值+栋/户」组合，或 ≥3 个「对象名+数值」对，判成段罗列。
  number_in_body: 正文只写判断与关键总量（如"十二个对象合计 34 栋、1560 户、12.5 万平方米"），分项数值进表。
  table_note: 表格同样要有依据块（锚点 `<章>-<节>-表N`），表内每个数值同样必须可指到材料/公开/推导/定稿值。
  example_good: "十二个改造对象合计 34 栋、1560 户、建筑面积 12.5 万平方米，其中最大的一个小区户数与面积均占约六成。"
  example_bad: "某小区 11 栋 300 户 3.2 万平方米、某路48号 2 栋 80 户 0.9 万平方米、……"

# 三、推断规则（无一手资料时的合法写法）
inference:
  allowed: true
  # 推断的三个合法来源，按优先级：
  bases:
    - 现有项目材料的间接证据（改造内容、清单条目、台账字段）
    - 同类项目的公开区间（须写明来源与检索日期）
    - 公开政策/标准/统计的约束值（须写明文件名或网址）
  must:
    - 标注「初步判定」与「推断依据」
    - 给出置信度（高/中/低）
    - 能给区间的给区间（A～B），不给单点假精确值
    - 与项目材料冲突时以项目材料为准并说明
  forbidden:
    - 把推断写成实测事实（不得去掉「推断」「初步判定」限定）
    - 编造具体数字、编造文号、编造来源
    - 用推断值填 TBL-07 等需实测的统计表（表内允许「估算值 + 反算依据」并标注「估算」）

# 四、联网检索（允许并鼓励，减少用户二次查资料）
# 程序不联网：检索由 agent 按《检索任务清单》执行，结果落盘并回填《检索台账》；
# 正文引用外部资料一律带编号 [S-0xx]，编号即台账条目，条目即 `file` 指向的落盘文件。
network:
  allowed: true
  encourage:
    - 上位规划与更新政策
    - 片区公开统计数据（人口、面积、设施）
    - 城市体检/造价/标准规范指标
    - 同类城市更新案例
  citation: "来源：<机构/文件名/网址>；编号 [S-0xx]；检索日期：YYYY-MM-DD"
  cite_format: "\\[S-\\d{2,}\\]"
  cite_rule: 写外部来源（含「据公开资料」「按同类项目公开区间」）必须带编号；无编号即判「空头依据」。
  not_found: "未获取公开数据，按同类项目区间推断（推断依据：…；置信度：低；已查口径与日期见台账 [S-0xx]）"
  not_found_rule: 标「低置信推断」且声称外部核实过时，台账必须有对应的 notFound 条目（reason + 检索日期）。
  never: 不得把查不到写成「资料缺失」，也不得用网络内容替换项目一手数据。

# 五、数据与量化要求
data_rule:
  min_facts_per_section: 2
  percent_format: 保留 1 位小数；区间用 A～B
  no_source_number: forbidden     # 无来源数字不许出现（推断也要写依据）
  estimated_value: "估算值须同行标注「估算」并写反算依据（如：按户均面积×户数反算）"
  # 缺项只在缺口版使用；干净版正文不出现缺项编号
  gap_ref_format: "缺项-<章字母><两位序号>"
  gap_inline_format: "【缺项-<章字母><两位序号>：…】"
  derived_value_note: "加总 / 测算 / 计算"
  units:
    - 平方米
    - 万平方米
    - 平方公里
    - 公里
    - 米
    - 户
    - 人
    - 个
    - 处
    - 家
    - 栋
    - 元
    - 万元
    - 亩
    - 项
    - "%"

# 六、第四章问题汇总（五要素，缺一即不合格）
problem_chapter:
  per_problem:
    - 表现：看得见的现象（结合项目实际，不写套话）
    - 证据：材料里的数/句，能复核的标「（可核对）」；仅推断的标「（推断，需现场核实）」
    - 成因：机制/历史/主体/资金/治理
    - 影响：对安全、民生、品质、运营的具体后果（尽量量化）
    - 对应更新方向：指向真实存在的章/节标题（如《现状综合研判与更新思路》的《核心更新改造方向》节），不写 S-NN 占位
  id_format: "P-\\d{2}"
  judgement_required: true   # 每类问题都要有初步判定，不得整列「资料缺失」
  no_data_rule: 数据不足时按五要素写「表现 + 证据（推断，需现场核实）+ 成因 + 影响 + 对应更新方向」；正文不写「置信度」三字，改由「（可核对）」/「（推断，需现场核实）」标注，章末用「本章结论中 X 条可直接核对、Y 条为推断」清点。

# 七、分析动作（每节必须走完，不允许只摘录）
analysis_chain:
  - step: 描述
    what: 是什么（现状事实、数据、引文）
  - step: 判断
    what: 好不好/差在哪（与规范、同类、目标对比；给出差距量级）
  - step: 归因
    what: 为什么（机制、历史、主体、资金、治理）
  - step: 衔接
    what: 与第四章问题/第五章对策的关系（问题编号 P-xx / 对策 S-xx）

# 八、禁句（命中即 fail）
# 禁句只在 `禁句表.yaml` 维护，本文件不再复制清单（避免多处漂移）。
# 禁句只禁「实质性缺口表述」「回避推断」与「空洞套话」，正常过渡语（如「需说明的是…」）放行。
banned_phrases_ref: 06-分章成文/规则/禁句表.yaml

# 九、篇幅
length:
  section_min_chars: 300
  section_max_chars: 900
  chapter_min_chars: 1500
  chapter_max_chars: 9000
  note: 超上限先压缩空话，不得删证据与关键判断。

# 十、跨章契约
cross_chapter:
  problem_id: "P-\\d{2}"
  strategy_id: "S-\\d{2}"
  mapping_requirement: 对策章每个 S 至少映射 1 个 P；映射率 ≥ 0.8
  no_duplicate: 相同段落（≥30 字）跨章重复 ≤3 处

# 十一、质量门
quality_gate:
  chapter_score_min: 80
  problem_strategy_mapping_min: 0.8
  max_rework_rounds: 2
  p1_definitions:
    - 编造事实/数字（无来源）
    - 整节或整类问题只有「资料缺失」而没有判定
    - 问题与对策脱节（映射率 <0.8）
    - 缺章/缺必答问题 >20%
    - 版式项（封面/目录/编号/表格题注/页眉页脚）缺失 ≥2 项
