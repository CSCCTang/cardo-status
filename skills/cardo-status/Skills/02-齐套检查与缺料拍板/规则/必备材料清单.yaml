# 必备材料清单 v1（cardo-project-material · 齐套性检查）
#
# 用途：check_materials.py 据此判断「某个方向的城市更新项目，做一份标准现状分析报告
#       （模板六章）所需的输入材料是否齐套」，并把缺项转成可直接发给用户的补齐提醒。
# 判定依据：报告模板正文每段都标注「（数据来源：项目资料、无人机航拍资料、网络资料）」，
#           本清单逐项落成「材料 → 影响模板哪几章」的对应关系。
#
# 结构：
#   common           三类方向都需要的通用材料
#   direction_extra  各方向在通用之外必须/建议增补的材料，键为方向目录名
#                    （方向名单以 项目库配置.yaml 的 directions 为准，方向一/二/三）
#
# 字段：
#   id             编号，common 用 M 段，方向增补用 S/F/X 段
#   name           材料名（写用户看得懂的全称）
#   level          缺失等级：必需 / 建议 / 可选
#                  - 必需：缺了对应章节就没有第一手依据，出稿前必须让用户拍板
#                  - 建议：有则更扎实，没有可先出稿
#                  - 可选：锦上添花，不提示
#   chapters       影响模板哪几章（模板六章：项目概述 / 片区基础概况分析 / 现状详细分析 /
#                  核心问题汇总 / 现状综合研判与更新思路 / 附件）
#   why            一句话说明「为什么需要」
#   hints          文件名或父目录命中的强关键词（命中即视为已有该材料）
#   weak_hints     弱线索关键词：命中只算「疑似」，需用户确认算不算
#   exclude_hints  一票否决词：文件名含这些词的文件不参与本项匹配
#                  （例：文件名是「…可行性研究报告的批复」时，对「可研」是批复不是可研）
#   ext            可接受的扩展名；给了就作为硬门槛（不在此列的扩展名不参与匹配）
#   source         向谁要（提醒文案直接用）
#   match_category 对应 分类规则.yaml 的类别（id 或 label 均可）；分类清单命中即强证据
#
# 判定口径（脚本实现，规则只提供材料）：
#   文件名命中 hints 每词 +3，父目录命中 hints 每词 +2，分类清单命中 match_category +6，
#   弱线索每词 +1；有强证据且 ≥3 分 = 已齐，只有弱证据 = 待确认-疑似，0 分 = 缺失。
#   「已齐」只证明「有这份材料」，不证明版本新、时效近——版本/时效另行确认。
#
# v2 口径（结论优先改版）：
#   * 本清单只影响「哪一章还能更强」，**不影响能否出稿**、不影响初步判定；
#   * 缺料不再写「缺了写不出」，正文也不写「资料缺失」——缺口只进 数据缺口清单.xlsx；
#   * 已按用户反馈删除 M16 既有成果：提资材料本身够用，不再要求上一版成果；
#   * M14 无人机航拍/现场影像由「必需」降为「可选」：有图引用、无图用文字描述，不出缺项。

version: 1

# ── 网络补齐策略（供 web-supplement 技能用；check_materials 暂不读，接线后按此判定）──
# 缺材料时先只「提醒」，不阻塞；用户可以选择「上网补齐」。上网能补什么、不能补什么，
# 由下面两组名单决定——**内部数据不许编**，这是硬边界。
web_fill_policy:
  # 可以上网补：公开、可核实、能给出处
  fillable_keywords:
    - 政策
    - 法规
    - 上位规划
    - 专项规划
    - 标准规范
    - 历史沿革
    - 公开统计
    - 片区概况
    - 周边配套
  # 不许上网补（属于项目内部事实，网上没有可信来源，只能等用户给）
  not_fillable_keywords:
    - 台账
    - 权属
    - 鉴定
    - 排查
    - 民意
    - 调研
    - 户数
    - 商户
    - 测绘
    - 影像
    - 航拍
  rules:
    - 每条网络补齐的内容必须写来源（机构/文件/网址）与获取日期，进报告时按「网络资料」标注
    - 与项目原始材料冲突时，一律以原始材料为准，并在正文注明差异
    - 不可补项不再写「待补」，改为按同类项目公开区间给出初步判定（标注「推断」+置信度），并在 数据缺口清单.xlsx 里登记「补了会把哪一章做得更准」
    - 撰写阶段应当主动检索政策、片区公开统计、体检/造价指标与同类案例，减少用户二次查资料

common:
  - id: M01
    name: 可行性研究报告（或项目申请报告）
    level: 必需
    chapters: [项目概述, 片区基础概况分析, 现状详细分析]
    why: 项目名称、性质、规模、投资、工期与现状问题的第一手来源
    hints: [可行性研究报告, 可研报告, 可研, 项目申请报告, 报批稿]
    exclude_hints: [批复, 请示, 审查意见, 复函, 核准]
    ext: [pdf, docx, doc, wps]
    source: 建设单位／可研编制单位
    source_note: 归入「批复与可研」组
    delivery_dir: 批复与可研
    match_category: 可行性研究报告

